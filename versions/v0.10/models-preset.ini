; PowerFocus 本地模型预设（llama-server router 模式）
; ── 通用说明（任何电脑/服务器可用）──────────────────────────
; 本文件是模板；model 路径按你的本机实际情况填写。
; 推荐做法：复制本文件为仓库根的 models-preset.local.ini（已被 gitignore），
; 在那里写本机模型路径，内置文件保持通用、不提交私有路径。
; 启动器（tools\model-router.ps1）会自动做存在性过滤：
;   · 本机不存在的模型条目自动跳过，不影响其他条目启动；
;   · 全部条目都不存在时，会给出配置指引并停止启动。
; section 名 = OpenAI 兼容接口里的 model id，必须与 IDE 自定义模型条目一致
; n-gpu-layers 数值为 2026-11-04 8GB 显存校准实测结果；其他显卡请自行校准
; ────────────────────────────────────────────────────────────

version = 1

[*]
threads = 16
threads-batch = 8
c = 8192
parallel = 1
n-gpu-layers = 99

[Qwen3.8-27B]
model = E:\Model_Zone\Qwen3.8-27B-UD-Q4_K_M\Qwen3.8-27B-UD-Q4_K_M.gguf
n-gpu-layers = 23
c = 8192
flash-attn = on
cache-type-k = q8_0
cache-type-v = f16
; 8GB 显卡显存不足时不预加载，由 IDE/控制台按需换载
load-on-startup = false

